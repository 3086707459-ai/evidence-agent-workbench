[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-agent-workbench"
version = "1.0.0"
description = "Durable, evidence-grounded agent with approval-bound side effects and reproducible engineering evaluations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openai>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=7,<8", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
evidence-agent = "evidence_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_agent = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
patch = ["subprocess"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
