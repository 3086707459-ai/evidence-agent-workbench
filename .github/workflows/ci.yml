name: Agent engineering checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Unit, integration, SDK and crash recovery checks
        run: pytest --cov=evidence_agent --cov-fail-under=85 --cov-report=term-missing --cov-report=xml:out/coverage.xml
      - name: Deterministic engineering evaluation
        run: evidence-agent evaluate --output out/evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence-py${{ matrix.python }}
          path: out/
